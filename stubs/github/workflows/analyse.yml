name: analyse

on:
  pull_request:
    branches: [ main, staging, dev ]

permissions:
  contents: read
  pull-requests: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: detect front-end changes
        id: changes
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - '**'
              - '!app/**'
              - '!bootstrap/**'
              - '!config/**'
              - '!database/**'
              - '!routes/**'
              - '!tests/**'
              - '!**/*.php'
              - '!composer.json'
              - '!composer.lock'
              - '!phpstan.neon'
              - '!psalm.xml'
              - '!pint.json'
              - '!.github/**'
              - '!**/*.md'
              - '!.ai/**'
              - '!.claude/**'
              - '!.junie/**'
              - '!.factory/**'
              - '!docs/**'
              - '!LICENSE'
              - '!.vex/**'

      - name: setup app
        uses: paolobellini/bellini.one/actions/laravel/setup-app@v1.1
        with:
          php-version: ${{ vars.PHP_VERSION || '8.5' }}
          node-version: ${{ vars.NODE_VERSION || '24' }}
          install-node: ${{ steps.changes.outputs.frontend }}

      - name: pint, phpstan, rector, psalm taint
        run: composer analyse

      - name: eslint, prettier, tsc
        if: ${{ !cancelled() && steps.changes.outputs.frontend == 'true' }}
        run: composer ci:node
