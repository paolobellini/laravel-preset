name: tests

on:
  pull_request:
    branches: [ main, staging, dev ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: ${{ vars.DB_CONNECTION || 'mysql' }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ vars.DB_PORT || '3306' }}
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      db:
        image: ${{ vars.DB_IMAGE || 'mysql:8.0' }}
        ports:
          - ${{ vars.DB_PORT || '3306' }}:${{ vars.DB_PORT || '3306' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: testing
        options: ${{ vars.DB_OPTIONS || '--health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=5' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup app
        uses: paolobellini/bellini.one/actions/laravel/setup-app@v1.1
        with:
          php-version: ${{ vars.PHP_VERSION || '8.5' }}
          node-version: ${{ vars.NODE_VERSION || '24' }}

      - name: generate app key
        run: php artisan key:generate

      - name: type coverage and test coverage
        run: composer tests
