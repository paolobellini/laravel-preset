name: security

on:
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .github/trivy.yaml
          ignore-unfixed: true
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: report vulnerabilities with no released fix
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          trivy-config: .github/trivy.yaml
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
